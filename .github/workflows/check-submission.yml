name: Check submission

# pull_request_target: 원본 레포(main)의 워크플로·스크립트로 검사합니다.
# PR에서 이 파일이나 검사 스크립트를 고쳐도 검사 방식은 바뀌지 않습니다.
# PR의 코드는 실행하지 않고 파일 목록만 읽습니다.
on:
  pull_request_target:
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: 원본 레포 받기
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: PR 커밋 받기 (실행하지 않음)
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: git fetch --no-tags origin "refs/pull/${PR_NUMBER}/head"

      - name: 제출 형식 검사
        env:
          AUTHOR: ${{ github.event.pull_request.user.login }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: bash .github/scripts/check-submission.sh
